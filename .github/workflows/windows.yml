name: windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache Goose
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: |
            goosekit
            ~\.goose
          key: goose-v2026.3-windows-x64-${{ hashFiles('bomberman.build', 'bomberman.goose') }}
          restore-keys: |
            goose-v2026.3-windows-x64-
      - name: Install Goose
        shell: pwsh
        run: |
          if (!(Test-Path goosekit)) {
            curl.exe -fsSL -o goose.zip https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-windows-x64.zip
            Expand-Archive goose.zip goosekit
          }
          $d = (Get-ChildItem goosekit -Recurse -Filter goose.exe | Select-Object -First 1).DirectoryName
          echo $d >> $env:GITHUB_PATH
      - name: Locate OpenSSL
        id: openssl
        shell: pwsh
        run: |
          $pre = "C:\Program Files\OpenSSL"
          if ((Test-Path "$pre\include\openssl\ssl.h") -and (Get-ChildItem "$pre\bin\libssl*.dll" -ErrorAction SilentlyContinue)) {
            echo "Using pre-installed OpenSSL at $pre"
            echo "OPENSSL_ROOT_DIR=$pre" >> $env:GITHUB_ENV
            echo "found=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "Pre-installed OpenSSL not found; falling back to vcpkg"
            echo "OPENSSL_ROOT_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
            echo "found=false" >> $env:GITHUB_OUTPUT
          }
      - name: Cache OpenSSL (vcpkg fallback)
        id: cache-openssl
        if: steps.openssl.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\installed\x64-windows
          key: vcpkg-openssl-x64-windows-v1
      - name: Install OpenSSL (vcpkg fallback)
        if: steps.openssl.outputs.found != 'true' && steps.cache-openssl.outputs.cache-hit != 'true'
        shell: cmd
        run: '"%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install openssl:x64-windows'
      - name: Build
        shell: cmd
        run: |
          set VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%
          call windows\build-windows.bat
      - name: Package
        shell: pwsh
        run: |
          Copy-Item windows\PLAY.txt dist\
          Compress-Archive -Force dist\* bomberman-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bomberman-windows
          path: bomberman-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes "Windows & macOS builds, unzip and run" 2>$null
          }
          gh release upload ${{ github.ref_name }} bomberman-windows.zip --clobber
