name: macos
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache Goose
        uses: actions/cache@v4
        with:
          path: |
            goosekit
            ~/.goose
          key: goose-v2026.3-macos-arm64-${{ hashFiles('bomberman.build', 'bomberman.goose') }}
          restore-keys: |
            goose-v2026.3-macos-arm64-
      - name: Install Goose
        run: |
          if [ ! -d goosekit ]; then
            mkdir -p goosekit
            curl -fsSL https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-macos-arm64.tar.gz | tar -xz -C goosekit
          fi
          d=$(dirname "$(find goosekit -name goose -type f | head -n 1)")
          echo "$d" >> "$GITHUB_PATH"
      - name: Install build deps
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          command -v cmake >/dev/null 2>&1 || brew install cmake
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build portable binary
        run: ./build-portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bomberman-mac-arm64
          path: bomberman-mac-arm64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Windows & macOS builds, unzip and run" || true
          gh release upload "${{ github.ref_name }}" bomberman-mac-arm64.zip --clobber
